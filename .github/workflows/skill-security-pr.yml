name: Skill checks

# Runs on every PR that adds or changes a skill and checks only the changed skills.
# A change to this workflow or its scripts, or a manual run, checks every skill.
on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skill-security-pr.yml"
      - ".github/scripts/check_skill_frontmatter.py"
      - ".github/snyk-agent-scan-allow.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        name: List skills to check
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || git diff --name-only "origin/$BASE_REF...HEAD" -- .github/ | grep -q .; then
            dirs=$(ls -d skills/*/)
          else
            dirs=$(git diff --name-only "origin/$BASE_REF...HEAD" -- skills/ | cut -d/ -f1-2)
          fi
          skills=$(echo "$dirs" | sed 's#/$##' | sort -u \
            | while read -r dir; do [ -f "$dir/SKILL.md" ] && echo "$dir"; done \
            | jq -R . | jq -sc .)
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Changed skills: $skills"

  frontmatter:
    needs: changes
    if: needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Check SKILL.md frontmatter
        run: python .github/scripts/check_skill_frontmatter.py $(echo '${{ needs.changes.outputs.skills }}' | jq -r '.[]')

  snyk-agent-scan:
    needs: changes
    if: needs.changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.changes.outputs.skills) }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Skip without token
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN is not set (or this is a fork PR); Snyk Agent Scan skipped for ${{ matrix.skill }}"
      # --ci requires --dangerously-run-mcp-servers, which starts every MCP server the
      # scan discovers. Make sure there is none: no MCP config in the skill, and an
      # empty HOME so no machine-wide agent config is found.
      - name: Refuse MCP server configs
        if: env.SNYK_TOKEN != ''
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          found=$(grep -rlE '"?mcpServers"?|\[mcp_servers' "$SKILL" \
            --include='*.json' --include='*.jsonc' --include='*.yaml' --include='*.yml' --include='*.toml' || true)
          if [ -n "$found" ]; then
            echo "::error::MCP server config found; refusing to run Snyk Agent Scan with --dangerously-run-mcp-servers:"
            echo "$found"
            exit 1
          fi
      - name: Snyk Agent Scan
        if: env.SNYK_TOKEN != ''
        # Sends the skill content to Snyk. --ci exits 1 when risks remain, 2 on bad usage.
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          set -o pipefail
          # Risks accepted for this skill, with reasons, live in .github/snyk-agent-scan-allow.json.
          ignore=$(jq -r --arg s "$SKILL" '.[$s] // {} | keys | join(",")' .github/snyk-agent-scan-allow.json)
          args=()
          if [ -n "$ignore" ]; then
            echo "::notice::$SKILL: accepted risks ignored: $ignore"
            args=(--ignore-risks "$ignore")
          fi
          export HOME="$(mktemp -d)"
          uvx snyk-agent-scan@0.6.9 --ci --dangerously-run-mcp-servers "${args[@]}" --json "$SKILL" \
            | tee "$GITHUB_WORKSPACE/snyk-agent-scan.json"
      - name: Upload report
        if: always() && env.SNYK_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: snyk-agent-scan-${{ strategy.job-index }}
          path: snyk-agent-scan.json
          if-no-files-found: ignore
