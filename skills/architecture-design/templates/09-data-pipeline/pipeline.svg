<text x="112.0" y="127.0" font-size="11.5" font-weight="normal" fill="#5F6B7A" text-anchor="middle">validate, store</text>
<line x1="202.0" y1="110.0" x2="266.0" y2="110.0" stroke="#5F6B7A" stroke-width="1.6"/>
<polygon points="276.0,110.0 266.0,115.0 266.0,105.0" fill="#5F6B7A"/>
<rect x="24.0" y="250" width="176" height="48" rx="7" fill="#F2F4F7" stroke="#D8DDE5" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="112.0" y="271.0" font-size="11.5" font-weight="normal" fill="#37474F" text-anchor="middle">invalid → refused,</text>
<text x="112.0" y="285.0" font-size="11.5" font-weight="normal" fill="#37474F" text-anchor="middle">not stored</text>
<line x1="112.0" y1="150.0" x2="112.0" y2="238.0" stroke="#B0BEC5" stroke-width="1.6" stroke-dasharray="4 4"/>
<polygon points="112.0,248.0 107.0,238.0 117.0,238.0" fill="#B0BEC5"/>
<rect x="278.0" y="72.0" width="176" height="76" rx="8" fill="#F2F4F7" stroke="#37474F" stroke-width="1.6"/>
<text x="366.0" y="90.0" font-size="10.5" font-weight="bold" fill="#37474F" text-anchor="middle">VENDOR</text>
<text x="366.0" y="109.0" font-size="13.5" font-weight="bold" fill="#1F2933" text-anchor="middle">Fraud check</text>
<text x="366.0" y="127.0" font-size="11.5" font-weight="normal" fill="#5F6B7A" text-anchor="middle">ORD111 → FRD001</text>
<line x1="456.0" y1="110.0" x2="520.0" y2="110.0" stroke="#5F6B7A" stroke-width="1.6"/>
<polygon points="530.0,110.0 520.0,115.0 520.0,105.0" fill="#5F6B7A"/>
<rect x="278.0" y="250" width="176" height="48" rx="7" fill="#F2F4F7" stroke="#D8DDE5" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="366.0" y="271.0" font-size="11.5" font-weight="normal" fill="#37474F" text-anchor="middle">FRD002 or timeout →</text>
<text x="366.0" y="285.0" font-size="11.5" font-weight="normal" fill="#37474F" text-anchor="middle">manual review task</text>
<line x1="366.0" y1="150.0" x2="366.0" y2="238.0" stroke="#B0BEC5" stroke-width="1.6" stroke-dasharray="4 4"/>
<polygon points="366.0,248.0 361.0,238.0 371.0,238.0" fill="#B0BEC5"/>
<rect x="532.0" y="72.0" width="176" height="76" rx="8" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="620.0" y="90.0" font-size="10.5" font-weight="bold" fill="#5F6B7A" text-anchor="middle">WAIT</text>
<text x="620.0" y="109.0" font-size="13.5" font-weight="bold" fill="#1F2933" text-anchor="middle">Score back</text>
<text x="620.0" y="127.0" font-size="11.5" font-weight="normal" fill="#5F6B7A" text-anchor="middle">≤ FRAUD_TIMEOUT</text>
<line x1="710.0" y1="110.0" x2="774.0" y2="110.0" stroke="#5F6B7A" stroke-width="1.6"/>
<polygon points="784.0,110.0 774.0,115.0 774.0,105.0" fill="#5F6B7A"/>
<rect x="786.0" y="72.0" width="176" height="76" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
