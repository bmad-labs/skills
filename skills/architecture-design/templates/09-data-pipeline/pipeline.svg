<text x="1128.0" y="109.0" font-size="13.5" font-weight="bold" fill="#1F2933" text-anchor="middle">Paid</text>
<text x="1128.0" y="127.0" font-size="11.5" font-weight="normal" fill="#5F6B7A" text-anchor="middle">ORD102 published</text>
