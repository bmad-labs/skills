<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 338" width="1240" height="338" preserveAspectRatio="xMidYMid meet" font-family="'Noto Sans', Arial, Helvetica, sans-serif">
<rect width="1240" height="338" fill="#FFFFFF"/>
<text x="24" y="40" font-size="13" font-weight="bold" fill="#37474F">One order, phase 1 — blue = built in order-service, grey = external</text>
<rect x="24.0" y="72.0" width="176" height="76" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
<text x="112.0" y="90.0" font-size="10.5" font-weight="bold" fill="#1565C0" text-anchor="middle">INTAKE</text>
