<text x="874.0" y="109.0" font-size="13.5" font-weight="bold" fill="#1F2933" text-anchor="middle">Charge</text>
<text x="874.0" y="127.0" font-size="11.5" font-weight="normal" fill="#5F6B7A" text-anchor="middle">key = orderId</text>
<line x1="964.0" y1="110.0" x2="1028.0" y2="110.0" stroke="#5F6B7A" stroke-width="1.6"/>
<polygon points="1038.0,110.0 1028.0,115.0 1028.0,105.0" fill="#5F6B7A"/>
<rect x="786.0" y="250" width="176" height="48" rx="7" fill="#F2F4F7" stroke="#D8DDE5" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="874.0" y="271.0" font-size="11.5" font-weight="normal" fill="#37474F" text-anchor="middle">declined → ORD103,</text>
<text x="874.0" y="285.0" font-size="11.5" font-weight="normal" fill="#37474F" text-anchor="middle">customer notified</text>
<line x1="874.0" y1="150.0" x2="874.0" y2="238.0" stroke="#B0BEC5" stroke-width="1.6" stroke-dasharray="4 4"/>
<polygon points="874.0,248.0 869.0,238.0 879.0,238.0" fill="#B0BEC5"/>
<rect x="1040.0" y="72.0" width="176" height="76" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
