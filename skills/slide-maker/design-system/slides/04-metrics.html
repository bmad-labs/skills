<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metrics</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { width: var(--slide-w); height: var(--slide-h); background: var(--surface-page);
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; padding: var(--slide-margin); }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--color-accent); }
  h1 { margin-top: var(--space-3); font-size: var(--fs-h1); font-weight: var(--fw-bold);
    line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 900px; }
  .rule { width: 56px; height: var(--rule-accent-w); background: var(--color-accent);
    border-radius: var(--radius-pill); margin-top: var(--space-5); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--slide-gutter);
    flex: 1; align-content: center; }
  .kpi { border-top: 3px solid var(--color-accent); padding-top: var(--space-6); }
  .kpi .val { font-size: 84px; font-weight: var(--fw-black); line-height: 1;
    letter-spacing: var(--ls-tight); color: var(--text-primary); }
  .kpi .val span { color: var(--color-accent); }
  .kpi .label { margin-top: var(--space-4); font-size: var(--fs-body); font-weight: var(--fw-medium); }
  .kpi .desc { margin-top: var(--space-2); font-size: var(--fs-small); color: var(--text-secondary);
    font-weight: var(--fw-light); line-height: var(--lh-normal); }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 20px; }
  .pageno { font-size: var(--fs-small); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="slide">
    <div>
      <span class="eyebrow">Success Metrics</span>
      <h1>The outcomes we measure</h1>
      <div class="rule"></div>
    </div>
    <div class="kpis">
      <div class="kpi">
        <div class="val">70<span>%</span></div>
        <div class="label">Weekly active use</div>
        <div class="desc">Target adoption across the target audience within the first quarter.</div>
      </div>
      <div class="kpi">
        <div class="val">50<span>%</span></div>
        <div class="label">Faster decisions</div>
        <div class="desc">Reduction in time to complete the core workflow end to end.</div>
      </div>
      <div class="kpi">
        <div class="val">8<span>/10</span></div>
        <div class="label">Satisfaction</div>
        <div class="desc">Average score on the quarterly experience survey.</div>
      </div>
    </div>
    <div class="foot">
      <img src="../assets/logos/logo-full.svg" alt="Your Brand">
      <span class="pageno">04</span>
    </div>
  </div>
</body>
</html>
