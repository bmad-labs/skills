<!-- @dsCard group="Slides" viewport="1280x720" name="Big quote" subtitle="Full-bleed pull quote with attribution" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { width: var(--slide-w); height: var(--slide-h); background: var(--ink-50);
    font-family: var(--font-sans); color: var(--text-primary); position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; padding: var(--slide-margin) 120px; }
  .mark { font-size: 200px; line-height: 0.7; font-weight: var(--fw-black); color: var(--color-accent-soft);
    height: 90px; }
  blockquote { font-size: 46px; font-weight: var(--fw-medium); line-height: 1.28;
    letter-spacing: var(--ls-tight); max-width: 980px; }
  blockquote em { color: var(--color-accent); font-style: normal; }
  .by { margin-top: var(--space-8); display: flex; align-items: center; gap: var(--space-4); }
  .by .bar { width: 40px; height: 3px; background: var(--color-accent); border-radius: var(--radius-pill); }
  .by .who { font-size: var(--fs-body); }
  .by .who strong { font-weight: var(--fw-bold); }
  .by .who span { display: block; color: var(--text-muted); font-size: var(--fs-small); }
  .logo { position: absolute; bottom: var(--slide-margin); right: 120px; height: 20px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="mark">&ldquo;</div>
    <blockquote>A memorable statement that frames the deck's core idea, with one <em>key phrase</em> emphasized.</blockquote>
    <div class="by">
      <div class="bar"></div>
      <div class="who"><strong>Name Surname</strong><span>Title, Team</span></div>
    </div>
    <img class="logo" src="../assets/logos/logo-full.svg" alt="Your Brand">
  </div>
</body>
</html>
