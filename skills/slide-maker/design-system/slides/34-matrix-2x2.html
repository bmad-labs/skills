<!-- @dsCard group="Slides" viewport="1280x720" name="Matrix 2×2" subtitle="A 2×2 quadrant with axis labels and one accent-highlighted quadrant" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matrix 2×2</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { width: var(--slide-w); height: var(--slide-h); background: var(--surface-page);
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; padding: var(--slide-margin); }
  .head { margin-bottom: var(--space-6); }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--color-accent); }
  h1 { margin-top: var(--space-3); font-size: var(--fs-h1); font-weight: var(--fw-bold);
    line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 820px; }
  .accent-rule { width: 56px; height: var(--rule-accent-w); background: var(--color-accent);
    border-radius: var(--radius-pill); margin-top: var(--space-5); }
  /* layout: y-axis label column + plot area; x-axis label sits under the plot */
  .plot-wrap { flex: 1; display: grid; grid-template-columns: 32px 1fr; grid-template-rows: 1fr 32px;
    gap: var(--space-4); }
  .yaxis { grid-column: 1; grid-row: 1; display: flex; align-items: center; justify-content: center; }
  .yaxis span { writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--text-muted); }
  .grid { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr; gap: var(--space-5); }
  .xaxis { grid-column: 2; grid-row: 2; display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--text-muted); }
  .cell { border-radius: var(--radius-lg); padding: var(--space-6); display: flex; flex-direction: column; }
  .cell.plain { background: var(--surface-subtle); border: var(--border-w) solid var(--border-subtle); }
  .cell.highlight { background: var(--color-accent); color: var(--text-inverse); box-shadow: var(--shadow-md); }
  .cell .q { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--text-muted); }
  .cell.highlight .q { color: var(--color-accent-soft); }
  .cell h3 { margin-top: var(--space-2); font-size: var(--fs-h3); font-weight: var(--fw-bold);
    line-height: var(--lh-snug); }
  .cell .items { margin-top: var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .cell .chip { font-size: var(--fs-small); font-weight: var(--fw-medium);
    background: var(--surface-card); border: var(--border-w) solid var(--border-subtle);
    color: var(--text-secondary); padding: var(--space-1) var(--space-4); border-radius: var(--radius-pill); }
  .cell.highlight .chip { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.24);
    color: var(--text-inverse); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-6); }
  .foot img { height: 20px; }
  .pageno { font-size: var(--fs-small); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="slide">
    <div class="head">
      <span class="eyebrow">How to prioritize</span>
      <h1>Impact against effort</h1>
      <div class="accent-rule"></div>
    </div>
    <div class="plot-wrap">
      <div class="yaxis"><span>Impact →</span></div>
      <div class="grid">
        <div class="cell highlight">
          <div class="q">High impact · Low effort</div>
          <h3>Do first</h3>
          <div class="items"><span class="chip">Quick win A</span><span class="chip">Quick win B</span></div>
        </div>
        <div class="cell plain">
          <div class="q">High impact · High effort</div>
          <h3>Plan for it</h3>
          <div class="items"><span class="chip">Big bet</span><span class="chip">Platform work</span></div>
        </div>
        <div class="cell plain">
          <div class="q">Low impact · Low effort</div>
          <h3>Do if spare time</h3>
          <div class="items"><span class="chip">Small tidy-up</span></div>
        </div>
        <div class="cell plain">
          <div class="q">Low impact · High effort</div>
          <h3>Avoid</h3>
          <div class="items"><span class="chip">Time sink</span></div>
        </div>
      </div>
      <div class="xaxis">Effort →</div>
    </div>
    <div class="foot">
      <img src="../assets/logos/logo-full.svg" alt="Your Brand">
      <span class="pageno">34</span>
    </div>
  </div>
</body>
</html>
