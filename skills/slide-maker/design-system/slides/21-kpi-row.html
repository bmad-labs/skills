<!-- @dsCard group="Slides" viewport="1280x720" name="KPI row" subtitle="A single clean row of stat + label figures" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KPI Row</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { width: var(--slide-w); height: var(--slide-h); background: var(--surface-page);
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; padding: var(--slide-margin); }
  .head { }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--color-accent); }
  h1 { margin-top: var(--space-3); font-size: var(--fs-h1); font-weight: var(--fw-bold);
    line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 900px; }
  .accent-rule { width: 56px; height: var(--rule-accent-w); background: var(--color-accent);
    border-radius: var(--radius-pill); margin-top: var(--space-5); }
  .row { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--slide-gutter);
    align-content: center; }
  .stat { display: flex; flex-direction: column; align-items: flex-start; }
  .stat .val { font-size: 72px; font-weight: var(--fw-black); line-height: 1;
    letter-spacing: var(--ls-tight); color: var(--color-accent); }
  .stat .val span { color: var(--text-primary); font-size: 48px; }
  .stat .label { margin-top: var(--space-4); font-size: var(--fs-body); font-weight: var(--fw-medium); }
  .stat .sep { width: 40px; height: 2px; background: var(--border-subtle);
    border-radius: var(--radius-pill); margin-top: var(--space-4); }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 20px; }
  .pageno { font-size: var(--fs-small); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="slide">
    <div class="head">
      <span class="eyebrow">By the numbers</span>
      <h1>Four figures that tell the story</h1>
      <div class="accent-rule"></div>
    </div>
    <div class="row">
      <div class="stat"><div class="val">98<span>%</span></div><div class="label">Uptime</div><div class="sep"></div></div>
      <div class="stat"><div class="val">2.5<span>×</span></div><div class="label">Faster onboarding</div><div class="sep"></div></div>
      <div class="stat"><div class="val">40<span>k</span></div><div class="label">Active users</div><div class="sep"></div></div>
      <div class="stat"><div class="val">12<span>mo</span></div><div class="label">Payback period</div><div class="sep"></div></div>
    </div>
    <div class="foot">
      <img src="../assets/logos/logo-full.svg" alt="Your Brand">
      <span class="pageno">21</span>
    </div>
  </div>
</body>
</html>
