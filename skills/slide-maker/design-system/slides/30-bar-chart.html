<!-- @dsCard group="Slides" viewport="1280x720" name="Bar chart" subtitle="A simple vertical bar chart with accent fills and neutral axes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar Chart</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { width: var(--slide-w); height: var(--slide-h); background: var(--surface-page);
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; padding: var(--slide-margin); }
  .head { }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--color-accent); }
  h1 { margin-top: var(--space-3); font-size: var(--fs-h1); font-weight: var(--fw-bold);
    line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 820px; }
  .accent-rule { width: 56px; height: var(--rule-accent-w); background: var(--color-accent);
    border-radius: var(--radius-pill); margin-top: var(--space-5); }
  .chart { flex: 1; display: flex; align-items: center; }
  .chart svg { width: 100%; height: 100%; }
  .chart .grid { stroke: var(--ink-200); stroke-width: 1; }
  .chart .axis { stroke: var(--ink-300); stroke-width: 1.5; }
  .chart .bar { fill: var(--color-accent); }
  .chart .bar.muted { fill: var(--ink-300); }
  .chart .val { fill: var(--text-primary); font-size: 15px; font-weight: 700; }
  .chart .cat { fill: var(--text-muted); font-size: 14px; }
  .chart .gl { fill: var(--text-muted); font-size: 12px; }
  .legend { display: flex; gap: var(--space-6); }
  .legend span { display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--fs-small); color: var(--text-secondary); }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }
  .legend .sw.a { background: var(--color-accent); }
  .legend .sw.m { background: var(--ink-300); }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 20px; }
  .pageno { font-size: var(--fs-small); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="slide">
    <div class="head">
      <span class="eyebrow">Growth by quarter</span>
      <h1>Adoption climbed every quarter</h1>
      <div class="accent-rule"></div>
    </div>
    <div class="chart">
      <svg viewBox="0 0 900 340" role="img" aria-label="Bar chart of adoption rising each quarter">
        <!-- gridlines -->
        <line class="grid" x1="70" y1="40"  x2="880" y2="40"></line>
        <line class="grid" x1="70" y1="110" x2="880" y2="110"></line>
        <line class="grid" x1="70" y1="180" x2="880" y2="180"></line>
        <line class="grid" x1="70" y1="250" x2="880" y2="250"></line>
        <!-- y labels -->
        <text class="gl" x="55" y="44"  text-anchor="end">100</text>
        <text class="gl" x="55" y="114" text-anchor="end">75</text>
        <text class="gl" x="55" y="184" text-anchor="end">50</text>
        <text class="gl" x="55" y="254" text-anchor="end">25</text>
        <!-- x axis -->
        <line class="axis" x1="70" y1="290" x2="880" y2="290"></line>
        <!-- bars (baseline y=290) -->
        <rect class="bar muted" x="120" y="200" width="90" height="90"  rx="4"></rect>
        <rect class="bar muted" x="300" y="160" width="90" height="130" rx="4"></rect>
        <rect class="bar"       x="480" y="110" width="90" height="180" rx="4"></rect>
        <rect class="bar"       x="660" y="60"  width="90" height="230" rx="4"></rect>
        <!-- value labels -->
        <text class="val" x="165" y="188" text-anchor="middle">32%</text>
        <text class="val" x="345" y="148" text-anchor="middle">46%</text>
        <text class="val" x="525" y="98"  text-anchor="middle">64%</text>
        <text class="val" x="705" y="48"  text-anchor="middle">82%</text>
        <!-- category labels -->
        <text class="cat" x="165" y="312" text-anchor="middle">Q1</text>
        <text class="cat" x="345" y="312" text-anchor="middle">Q2</text>
        <text class="cat" x="525" y="312" text-anchor="middle">Q3</text>
        <text class="cat" x="705" y="312" text-anchor="middle">Q4</text>
      </svg>
    </div>
    <div class="legend" style="margin-bottom: var(--space-6);">
      <span><span class="sw a"></span>Current period</span>
      <span><span class="sw m"></span>Prior period</span>
    </div>
    <div class="foot">
      <img src="../assets/logos/logo-full.svg" alt="Your Brand">
      <span class="pageno">30</span>
    </div>
  </div>
</body>
</html>
