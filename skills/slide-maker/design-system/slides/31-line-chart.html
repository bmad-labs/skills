<!-- @dsCard group="Slides" viewport="1280x720" name="Line chart" subtitle="A simple two-series line chart with accent primary and neutral axes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line Chart</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { width: var(--slide-w); height: var(--slide-h); background: var(--surface-page);
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; padding: var(--slide-margin); }
  .head { }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--color-accent); }
  h1 { margin-top: var(--space-3); font-size: var(--fs-h1); font-weight: var(--fw-bold);
    line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 820px; }
  .accent-rule { width: 56px; height: var(--rule-accent-w); background: var(--color-accent);
    border-radius: var(--radius-pill); margin-top: var(--space-5); }
  .chart { flex: 1; display: flex; align-items: center; }
  .chart svg { width: 100%; height: 100%; }
  .chart .grid { stroke: var(--ink-200); stroke-width: 1; }
  .chart .axis { stroke: var(--ink-300); stroke-width: 1.5; }
  .chart .primary { fill: none; stroke: var(--color-accent); stroke-width: 3.5;
    stroke-linecap: round; stroke-linejoin: round; }
  .chart .secondary { fill: none; stroke: var(--ink-400); stroke-width: 2.5;
    stroke-dasharray: 6 6; stroke-linecap: round; stroke-linejoin: round; }
  .chart .dot { fill: var(--color-accent); }
  .chart .gl { fill: var(--text-muted); font-size: 12px; }
  .chart .cat { fill: var(--text-muted); font-size: 14px; }
  .legend { display: flex; gap: var(--space-6); margin-bottom: var(--space-6); }
  .legend span { display: flex; align-items: center; gap: var(--space-2);
    font-size: var(--fs-small); color: var(--text-secondary); }
  .legend .sw { width: 20px; height: 3px; border-radius: var(--radius-pill); }
  .legend .sw.a { background: var(--color-accent); }
  .legend .sw.m { background: var(--ink-400); }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 20px; }
  .pageno { font-size: var(--fs-small); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="slide">
    <div class="head">
      <span class="eyebrow">Trend over time</span>
      <h1>Our line pulled clear of the baseline</h1>
      <div class="accent-rule"></div>
    </div>
    <div class="chart">
      <svg viewBox="0 0 900 340" role="img" aria-label="Line chart with a rising primary series above a flatter baseline">
        <!-- gridlines -->
        <line class="grid" x1="70" y1="40"  x2="880" y2="40"></line>
        <line class="grid" x1="70" y1="110" x2="880" y2="110"></line>
        <line class="grid" x1="70" y1="180" x2="880" y2="180"></line>
        <line class="grid" x1="70" y1="250" x2="880" y2="250"></line>
        <text class="gl" x="55" y="44"  text-anchor="end">100</text>
        <text class="gl" x="55" y="114" text-anchor="end">75</text>
        <text class="gl" x="55" y="184" text-anchor="end">50</text>
        <text class="gl" x="55" y="254" text-anchor="end">25</text>
        <!-- x axis -->
        <line class="axis" x1="70" y1="290" x2="880" y2="290"></line>
        <!-- secondary (baseline) series -->
        <polyline class="secondary" points="110,250 264,242 418,238 572,226 726,222 862,214"></polyline>
        <!-- primary series -->
        <polyline class="primary" points="110,258 264,214 418,182 572,132 726,96 862,58"></polyline>
        <circle class="dot" cx="110" cy="258" r="5"></circle>
        <circle class="dot" cx="264" cy="214" r="5"></circle>
        <circle class="dot" cx="418" cy="182" r="5"></circle>
        <circle class="dot" cx="572" cy="132" r="5"></circle>
        <circle class="dot" cx="726" cy="96"  r="5"></circle>
        <circle class="dot" cx="862" cy="58"  r="5"></circle>
        <!-- category labels -->
        <text class="cat" x="110" y="312" text-anchor="middle">Jan</text>
        <text class="cat" x="264" y="312" text-anchor="middle">Feb</text>
        <text class="cat" x="418" y="312" text-anchor="middle">Mar</text>
        <text class="cat" x="572" y="312" text-anchor="middle">Apr</text>
        <text class="cat" x="726" y="312" text-anchor="middle">May</text>
        <text class="cat" x="862" y="312" text-anchor="middle">Jun</text>
      </svg>
    </div>
    <div class="legend">
      <span><span class="sw a"></span>Our product</span>
      <span><span class="sw m"></span>Baseline</span>
    </div>
    <div class="foot">
      <img src="../assets/logos/logo-full.svg" alt="Your Brand">
      <span class="pageno">31</span>
    </div>
  </div>
</body>
</html>
