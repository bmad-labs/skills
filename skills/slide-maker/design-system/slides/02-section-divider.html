<!-- @dsCard group="Slides" viewport="1280x720" name="Section divider" subtitle="Full-bleed green section break with index number" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTI — Section Divider</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide {
    width: var(--slide-w); height: var(--slide-h);
    background: var(--mti-green);
    position: relative; overflow: hidden;
    font-family: var(--font-sans); color: var(--text-inverse);
    display: flex; flex-direction: column; justify-content: center;
    padding: var(--slide-margin);
  }
  /* decorative wave dots motif, echoing the logo */
  .slide::before {
    content: ""; position: absolute; right: -80px; top: -80px;
    width: 380px; height: 380px; border-radius: 50%;
    background: rgba(255,255,255,0.07);
  }
  .slide::after {
    content: ""; position: absolute; left: var(--slide-margin); bottom: var(--slide-margin);
    width: 12px; height: 12px; border-radius: 50%; background: var(--mti-yellow);
    box-shadow: 22px 0 0 rgba(255,255,255,0.55), 44px 0 0 rgba(255,255,255,0.3);
  }
  .index { font-size: 120px; font-weight: var(--fw-black); line-height: 1;
    color: rgba(255,255,255,0.28); letter-spacing: var(--ls-tight); }
  .eyebrow { margin-top: var(--space-4); font-size: var(--fs-eyebrow); font-weight: var(--fw-bold);
    letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--yellow-300); }
  h2 { margin-top: var(--space-3); font-size: 56px; font-weight: var(--fw-black);
    line-height: var(--lh-tight); letter-spacing: var(--ls-tight); max-width: 860px; }
  .sub { margin-top: var(--space-5); font-size: var(--fs-lead); font-weight: var(--fw-light);
    color: rgba(255,255,255,0.85); max-width: 640px; }
  .logo { position: absolute; top: var(--slide-margin); left: var(--slide-margin); height: 24px; }
</style>
</head>
<body>
  <div class="slide">
    <img class="logo" src="../assets/logos/mti-logo-full.svg" alt="MTI Technology" style="filter: brightness(0) invert(1);">
    <div class="index">01</div>
    <span class="eyebrow">Section</span>
    <h2>The section title for this part of the deck</h2>
    <p class="sub">An optional supporting line that frames what comes next.</p>
  </div>
</body>
</html>
