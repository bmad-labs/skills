<!-- @dsCard group="Slides" viewport="1280x720" name="Donut chart" subtitle="A ring chart with an accent arc, neutral track, center label and legend" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Donut Chart</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { width: var(--slide-w); height: var(--slide-h); background: var(--surface-page);
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; padding: var(--slide-margin); }
  .head { }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--color-accent); }
  h1 { margin-top: var(--space-3); font-size: var(--fs-h1); font-weight: var(--fw-bold);
    line-height: var(--lh-snug); letter-spacing: var(--ls-tight); max-width: 820px; }
  .accent-rule { width: 56px; height: var(--rule-accent-w); background: var(--color-accent);
    border-radius: var(--radius-pill); margin-top: var(--space-5); }
  .body { flex: 1; display: grid; grid-template-columns: 360px 1fr; align-items: center; gap: var(--space-16); }
  .ring { position: relative; width: 300px; height: 300px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--ink-200); stroke-width: 34; }
  .ring .arc { fill: none; stroke: var(--color-accent); stroke-width: 34;
    stroke-linecap: round; stroke-dasharray: 512.7 241.3; }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .ring .pct { font-size: 72px; font-weight: var(--fw-black); color: var(--color-accent);
    line-height: 1; letter-spacing: var(--ls-tight); }
  .ring .pct-label { margin-top: var(--space-2); font-size: var(--fs-small); color: var(--text-muted);
    font-weight: var(--fw-medium); }
  .legend { display: flex; flex-direction: column; gap: var(--space-5); }
  .legend .item { display: flex; align-items: flex-start; gap: var(--space-4); }
  .legend .sw { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 4px; margin-top: 4px; }
  .legend .sw.a { background: var(--color-accent); }
  .legend .sw.m { background: var(--ink-200); }
  .legend .lbl { font-size: var(--fs-h3); font-weight: var(--fw-bold); }
  .legend .lbl span { display: block; font-size: var(--fs-small); font-weight: var(--fw-light);
    color: var(--text-secondary); margin-top: var(--space-1); }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 20px; }
  .pageno { font-size: var(--fs-small); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="slide">
    <div class="head">
      <span class="eyebrow">Share of total</span>
      <h1>Most of the volume is already covered</h1>
      <div class="accent-rule"></div>
    </div>
    <div class="body">
      <div class="ring">
        <svg viewBox="0 0 280 280" role="img" aria-label="Donut chart showing 68 percent covered">
          <circle class="track" cx="140" cy="140" r="120"></circle>
          <circle class="arc"   cx="140" cy="140" r="120"></circle>
        </svg>
        <div class="center">
          <div class="pct">68%</div>
          <div class="pct-label">covered</div>
        </div>
      </div>
      <div class="legend">
        <div class="item"><span class="sw a"></span><div class="lbl">Covered<span>Already in scope and delivering value today.</span></div></div>
        <div class="item"><span class="sw m"></span><div class="lbl">Remaining<span>Planned for the next phase of the rollout.</span></div></div>
      </div>
    </div>
    <div class="foot">
      <img src="../assets/logos/logo-full.svg" alt="Your Brand">
      <span class="pageno">32</span>
    </div>
  </div>
</body>
</html>
