<!-- @dsCard group="Slides" viewport="1280x720" name="Single KPI hero" subtitle="One giant KPI number as the focal point with supporting sentence" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Single KPI Hero</title>
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--ink-100); }
  .slide { position: relative; overflow: hidden;
    width: var(--slide-w); height: var(--slide-h); background: var(--surface-page);
    font-family: var(--font-sans); color: var(--text-primary);
    display: flex; flex-direction: column; padding: var(--slide-margin); }
  /* single soft accent blob for depth, bleeding off the corner */
  .bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bg .blob { position: absolute; border-radius: 50%; background: var(--color-accent-soft);
    width: 620px; height: 620px; right: -220px; bottom: -240px; }
  .head { position: relative; z-index: 1; }
  .eyebrow { font-size: var(--fs-eyebrow); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
    text-transform: uppercase; color: var(--color-accent); }
  .accent-rule { width: 56px; height: var(--rule-accent-w); background: var(--color-accent);
    border-radius: var(--radius-pill); margin-top: var(--space-4); }
  .hero { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column;
    justify-content: center; }
  .num { font-size: var(--fs-display); font-weight: var(--fw-black); line-height: .9;
    letter-spacing: var(--ls-tight); color: var(--color-accent); }
  .num span { color: var(--text-primary); }
  .label { margin-top: var(--space-5); font-size: var(--fs-h2); font-weight: var(--fw-bold);
    color: var(--text-primary); }
  .desc { margin-top: var(--space-4); font-size: var(--fs-lead); font-weight: var(--fw-light);
    color: var(--text-secondary); line-height: var(--lh-normal); max-width: 640px; }
  .foot { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
  .foot img { height: 20px; }
  .pageno { font-size: var(--fs-small); color: var(--text-muted); }
</style>
</head>
<body>
  <div class="slide">
    <div class="bg"><div class="blob"></div></div>
    <div class="head">
      <span class="eyebrow">The headline number</span>
      <div class="accent-rule"></div>
    </div>
    <div class="hero">
      <div class="num">3.4<span>×</span></div>
      <div class="label">Return on the first year</div>
      <p class="desc">A single, decisive figure that anchors the whole story — everything else on this deck supports it.</p>
    </div>
    <div class="foot">
      <img src="../assets/logos/logo-full.svg" alt="Your Brand">
      <span class="pageno">20</span>
    </div>
  </div>
</body>
</html>
