[program:box-cua-serve]
command=/usr/local/bin/box-cua-serve
user=cua
environment=HOME="/home/cua"
autostart=true
autorestart=true
stdout_logfile=/var/log/box-cua-serve.log
redirect_stderr=true

; An app server that binds 127.0.0.1 inside the container cannot be reached through a published
; port. Forward it with socat and publish the socat port on the host loopback in compose.yaml.
; [program:box-app-relay]
; command=/usr/bin/socat TCP-LISTEN:<socat-port>,fork,reuseaddr TCP:127.0.0.1:<app-port>
; user=cua
; autostart=true
; autorestart=true
; stdout_logfile=/var/log/box-app-relay.log
; redirect_stderr=true
